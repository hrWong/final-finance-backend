server:
  port: 8080

spring:
  application:
    name: final-finance-backend
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/final_finance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: 1q2w3e4r
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cache:
    cache-names:
      - quotes
      - histories
      - fundamentals

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

market:
  itick:
    base-url: https://api-free.itick.org
    token:
    # Optional explicit proxy. If omitted, the client will try HTTPS_PROXY/http_proxy/ALL_PROXY env vars.
    proxy-uri:
    connect-timeout-millis: 5000
    response-timeout-seconds: 10
    user-agent: Mozilla/5.0
    quote-cache-ttl-seconds: 60
    history-cache-ttl-seconds: 600
    fundamentals-cache-ttl-seconds: 1800

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
