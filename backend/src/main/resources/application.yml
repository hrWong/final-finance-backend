server:
  port: 8088

spring:
  application:
    name: final-finance-backend
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/final_finance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
  cache:
    cache-names:
      - quotes
      - histories
      - fundamentals

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

market:
  itick:
    base-url: https://api-free.itick.org
    token: 258dd36e726a4b6ba99b77a5870a75f1f49d3515378f4c87972f7ba722b66d4f
    proxy-uri: http://127.0.0.1:7897
    connect-timeout-millis: 5000
    response-timeout-seconds: 10
    user-agent: Mozilla/5.0
    quote-cache-ttl-seconds: 60
    history-cache-ttl-seconds: 600
    fundamentals-cache-ttl-seconds: 1800

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-1537466b7caa418ea3dabcddc2d616c8
      model-name: deepseek-chat
      temperature: 0.3
      timeout: 60s
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-1537466b7caa418ea3dabcddc2d616c8
      model-name: deepseek-chat
      temperature: 0.3
      timeout: 60s
